<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Thông tin - Nguyện Hiệu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-page">
        <div class="top-controls">
            <a href="index.html" class="nav-btn">Trang chủ </a>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round">
                        <svg class="sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg class="moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </div>
                </label>
            </div>
        </div>

        <section class="register-section">
            <div class="register-container">
                <h2 class="section-title" style="margin-bottom: 20px; font-size: 3rem;">Đăng Ký nhận thông tin</h2>
                <p class="register-subtitle">Đừng bỏ lữ những cập nhật lới nhất từ Hịu nhé!</p>
                
                <form class="register-form" action="#" method="POST" id="registerForm">
                    <div class="form-group">
                        <label for="fullname">Họ và tên <span style="color: red;">*</span></label>
                        <input type="text" id="fullname" name="fullname" placeholder="Nhập hễ tên của bạn" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email <span style="color: red;">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại">
                    </div>

                    <div class="form-group">
                        <label>Giới tính <span style="color: red;">*</span></label>
                        <div class="gender-options">
                            <div class="gender-option">
                                <input type="radio" id="gender-male" name="gender" value="male" required>
                                <label for="gender-male">Nam</label>
                            </div>
                            <div class="gender-option">
                                <input type="radio" id="gender-female" name="gender" value="female" required>
                                <label for="gender-female">Nữ</label>
                            </div>
                            <div class="gender-option">
                                <input type="radio" id="gender-other" name="gender" value="other" required>
                                <label for="gender-other">Khác</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="interest">Chủ đề quan tâm</label>
                        <select id="interest" name="interest">
                            <option value="tech">Công nghệ & IT</option>
                            <option value="life">Cuộc sống đời thường</option>
                            <option value="f1">Đua xe F1</option>
                            <option value="music">Âm nhạc</option>
                            <option value="gaming">Trò chơi điện tử</option>
                            <option value="pets">Thú cưng</option>
                            <option value="other">Khác</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">Đăng ký ngay</button>
                </form>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const gender = document.querySelector("input[name=\"gender\"]:checked");
            
            if (!fullname) {
                alert("Vui lòng nhập hễ và tên!");
                e.preventDefault();
                return;
            }
            if (!email) {
                alert("Vui lòng nhập email!");
                e.preventDefault();
                return;
            }
            if (!gender) {
                alert("Vui lòng chọn giới tính?");
                e.preventDefault();
                return;
            }
            
            alert("Đăng Ký thành công!");
            e.preventDefault(); // for demo
        });
    </script>
</body>
</html>
